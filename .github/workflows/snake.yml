name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: salalmufeed3344
          outputs: dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
